name: Diagnostico Vercel

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Testar acessos do token
        run: |
          TEAM=team_6bHhc4JY5SVPobCRzYbqFVyd
          API=https://api.vercel.com
          check() {
            code=$(curl -s -o /tmp/r -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$API$1")
            echo "$code $1 -> $(jq -c '{erro: .error.code, msg: .error.message, projetos: ([.projects[]?.name]), times: ([.teams[]?.slug]), nome: .name}' /tmp/r)"
          }
          check "/v2/user"
          check "/v2/teams"
          check "/v9/projects"
          check "/v9/projects?teamId=$TEAM"
          check "/v9/projects/fundamental-copilot-br?teamId=$TEAM"
          check "/v9/projects/prj_9GGof3PPcWUf5OeNHA7ZHSPYITOn?teamId=$TEAM"
          check "/v9/projects/v0-image-analysis?teamId=$TEAM"
